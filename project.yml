name: SuperIsland
options:
  bundleIdPrefix: com.workview
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  SuperIsland:
    type: application
    platform: macOS
    sources:
      - path: SuperIsland
        excludes:
          - "**/.DS_Store"
      - path: ExtensionHost
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    scheme:
      buildImplicitDependencies: true
      testTargets:
        - SuperIslandTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIsland
        INFOPLIST_FILE: SuperIsland/Info.plist
        CODE_SIGN_ENTITLEMENTS: SuperIsland/SuperIsland.entitlements
        PRODUCT_NAME: SuperIsland
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "11"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: SuperIsland/SuperIsland.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
    postCompileScripts:
      - name: "Copy Built-in Extensions"
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundledExtensions"
          mkdir -p "$DEST"

          for ext in pomodoro live-football linear-mentions lastfm-scrobbler; do
            SRC="${SRCROOT}/Extensions/${ext}"
            if [ -d "$SRC" ]; then
              rsync -a --delete \
                --exclude="node_modules/" \
                --exclude=".DS_Store" \
                --exclude="__pycache__/" \
                "${SRC}/" "${DEST}/${ext}/"
            fi
          done
  SuperIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SuperIslandTests
    dependencies:
      - target: SuperIsland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workview.SuperIslandTests
        GENERATE_INFOPLIST_FILE: true
